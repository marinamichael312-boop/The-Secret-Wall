<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Secret Wall</title><style>
:root{font-family:system-ui,Tahoma,sans-serif;color:#edf4ff;background:#0c1526}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#1b3150,#0c1526 65%)}main{max-width:1100px;margin:auto;padding:22px}h1{margin:10px 0;font-size:clamp(26px,5vw,44px)}h2{margin:8px 0 20px}.muted{color:#afc0d6}.panel{background:#17263c;border:1px solid #33465f;border-radius:20px;padding:22px;margin:15px 0}.flex{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.center{text-align:center}button,input,textarea{font:inherit}button{border:0;border-radius:12px;padding:13px 20px;cursor:pointer;background:#4b88ee;color:white;font-weight:700}button:disabled{opacity:.4;cursor:not-allowed}button.secondary{background:#344963}button.green{background:#198e6d}button.red{background:#b84d55}button.gold{background:#d49a34;color:#172030}button.big{font-size:24px;padding:25px;width:100%}input,textarea{background:#0d1b2d;color:white;border:1px solid #526783;padding:12px;border-radius:10px;width:100%}label{display:block;margin:12px 0 5px}.score{font-size:clamp(38px,8vw,84px);font-weight:900}.scoreplus{color:#8be7b9}.scoreminus{color:#ffabb0}.team{background:#203652;border-radius:18px;padding:20px;text-align:center}.team h2{font-size:clamp(20px,3vw,38px)}.wallstage{background:linear-gradient(#12263b,#1b3044);border-radius:14px;min-height:290px;position:relative;overflow:hidden;display:flex;align-items:end;justify-content:center}.brickfield{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);align-content:end;gap:3px;padding:8px;z-index:3}.brick{background:linear-gradient(130deg,#e6a074,#ad513e);border:2px solid #8e4134;border-radius:3px;box-shadow:inset 0 2px #f6bd92;animation:pop .35s ease both}.brick.breaking{animation:break .55s ease forwards}.door{width:48%;height:83%;border:9px solid #8c9da9;border-radius:90px 90px 0 0;background:#68452f;position:absolute;bottom:0;left:26%;transform:translateY(105%);transition:transform 1s ease;box-shadow:inset 0 0 0 5px #9b7550;z-index:1}.door.visible{transform:translateY(0)}.door:before{content:'';position:absolute;left:50%;height:100%;border-left:4px solid #35261f}.door:after{content:'';position:absolute;right:14%;top:58%;width:9px;height:9px;border-radius:50%;background:#f5d68a}.door.open{background:#29654f;transform:translateY(0) perspective(500px) rotateY(-12deg)}.dust{position:absolute;bottom:10%;font-size:36px;z-index:4;animation:fade .7s forwards}.status{padding:10px;border-radius:9px;background:#283d57}.hidden{display:none!important}.tiny{font-size:12px}.nav a{color:#b6d3ff;margin-inline-end:14px}#message{margin:12px 0;color:#f9cf8d}.round{font-size:18px;letter-spacing:2px}.full{min-height:100vh;display:flex;align-items:center;justify-content:center}.intro{font-size:clamp(26px,5vw,64px);text-align:center}.projector .team{min-height:210px}.projector .wallstage{min-height:360px}@keyframes pop{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}@keyframes break{to{transform:translateY(100px) rotate(25deg) scale(.3);opacity:0}}@keyframes fade{to{opacity:0;transform:translateY(-70px)}}@media(max-width:650px){.grid{grid-template-columns:1fr}.projector .grid{grid-template-columns:repeat(2,minmax(0,1fr))}.projector .wallstage{min-height:230px}main{padding:12px}.panel{padding:15px}}
</style></head><body><main id="root"></main><script type="module">
const API='REPLACE_WITH_WORKER_URL';
const root=document.querySelector('#root'),params=new URLSearchParams(location.search),role=params.get('role')||'home',team=params.get('team')==='B'?'B':'A',room=params.get('room')||'demo';
let state={events:[],phase:'play',revealStep:0,round:1,names:{A:'',B:''},revision:-1};let localMode=false,timer=null,animationPlaying=false;
const label=t=>escapeHtml((state.names||{})[t]||'Team '+t);
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const endpoint=()=>API.replace(/\/$/,'')+'/api/game?room='+encodeURIComponent(room);
function events(){return (state.events||[]).map((v,i)=>({...v,id:v.id||String(i)}))}
function score(t){let x=events().filter(e=>e.team===t);return {plus:x.filter(e=>e.type==='+').length,minus:x.filter(e=>e.type==='-').length}}
function stageScore(t,n){return events().slice(0,n).filter(e=>e.team===t).reduce((v,e)=>Math.max(0,v+(e.type==='+'?1:-1)),0)}
function url(r,t){let p=new URLSearchParams({role:r,room});if(t)p.set('team',t);return location.origin+location.pathname+'?'+p}
function notify(s){let el=document.querySelector('#message');if(el)el.textContent=s;else alert(s)}
async function sync(){try{let r=await fetch(endpoint(),{cache:'no-store'});if(!r.ok)throw Error('Server unavailable');let v=await r.json();if(v.revision!==state.revision){state=v;render()}}catch(e){let el=document.querySelector('#message');if(el)el.textContent='⚠️ الاتصال غير متاح: '+e.message}}
function adminPin(){let p=sessionStorage.getItem('sw-admin-pin');if(!p){p=prompt('أدخلي رمز الأدمن (ADMIN PIN)');if(p)sessionStorage.setItem('sw-admin-pin',p)}return p}
async function action(body,admin=false){if(admin){let pin=adminPin();if(!pin)return;body.pin=pin}try{let r=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let v=await r.json();if(!r.ok){if(r.status===403)sessionStorage.removeItem('sw-admin-pin');throw Error(v.error||'Request failed')}state=v;render()}catch(e){notify(e.message)}}
async function addPoint(type){await action({action:'point',team,type})}
async function undo(){await action({action:'undo',team})}
async function renameTeam(t,name){name=name.trim().slice(0,28);if(name)await action({action:'name',team:t,name})}
function update(fn){let draft=JSON.parse(JSON.stringify(state));fn(draft);let body;if(draft.phase!==state.phase)body={action:'phase',value:draft.phase};else if(draft.revealStep!==state.revealStep)body={action:'step',delta:draft.revealStep-state.revealStep};else if(draft.round!==state.round)body={action:'round',delta:draft.round-state.round};else if(draft.events.length===0&&state.events.length>0)body={action:'reset'};else return Promise.resolve();return action(body,true)}
function save(){return Promise.resolve()}
function init(){render();sync();setInterval(sync,1000)}
function shell(inner){root.innerHTML=`<div class="flex between"><h1>🧱 The Secret Wall</h1><span class="muted">ROOM: ${escapeHtml(room)}</span></div><div class="nav tiny"><a href="${url('home')}">الرئيسية</a><a href="${url('control','A')}">فريق A</a><a href="${url('control','B')}">فريق B</a><a href="${url('projector')}">العرض</a><a href="${url('admin')}">المدير</a></div><div id="message"></div>${inner}`}
function home(){shell(`<div class="panel center"><h2>اختار دورك</h2><p class="muted">لينك واحد لكل الأجهزة — بدون حسابات للخدام</p><div class="grid"><button id="chooseA" class="big">🔵 Team A</button><button id="chooseB" class="big">🟠 Team B</button><button id="chooseAdmin" class="secondary">⚙️ Admin</button><button id="chooseProjector" class="secondary">🖥️ Projector</button></div></div>`);for(const t of ['A','B'])document.querySelector('#choose'+t).onclick=()=>location.href=url('control',t);document.querySelector('#chooseAdmin').onclick=()=>location.href=url('admin');document.querySelector('#chooseProjector').onclick=()=>location.href=url('projector')}
function control(){let s=score(team);const current=(state.names||{})[team]||'';if(!current){shell(`<div class="panel center"><h2>اسم فريق ${team}</h2><p class="muted">اختاروا اسم الفريق للعبة دي</p><input id="teamname" maxlength="28" placeholder="اكتبوا اسم الفريق" autocomplete="off"><p><button id="setname" class="green big">ابدأ اللعب</button></p></div>`);document.querySelector('#setname').onclick=()=>renameTeam(team,document.querySelector('#teamname').value);return}shell(`<div class="panel center"><h2>📱 ${label(team)}</h2><p class="muted">سجّل النقط بدون كشف معنى النتيجة</p><div class="grid"><div class="team"><div class="score scoreplus">${s.plus} +</div><p>النقط الموجبة</p><button class="green big" id="plus" ${state.phase!=='play'?'disabled':''}>+ إضافة</button></div><div class="team"><div class="score scoreminus">${s.minus} −</div><p>النقط السالبة</p><button class="red big" id="minus" ${state.phase!=='play'?'disabled':''}>− إضافة</button></div></div><p><button class="secondary" id="undo" ${state.phase!=='play'?'disabled':''}>↶ تراجع عن آخر تسجيل</button></p><p class="muted">التحدي الحالي: ${state.round||1}</p></div>`);document.querySelector('#plus').onclick=()=>addPoint('+');document.querySelector('#minus').onclick=()=>addPoint('-');document.querySelector('#undo').onclick=undo}
function scoreCard(t){const s=score(t);return `<div class="team"><h2>${label(t)}</h2><div class="flex" style="justify-content:space-evenly"><div><div class="score scoreplus">${s.plus}</div><b>+</b></div><div><div class="score scoreminus">${s.minus}</div><b>−</b></div></div></div>`}
function wallCard(t,n,finished){const num=stageScore(t,n),s=score(t),pass=finished&&s.minus>s.plus;let bricks='';for(let i=0;i<Math.min(num,36);i++)bricks+=`<div class="brick" style="grid-column:${i%6+1};grid-row:${6-Math.floor(i/6)}"></div>`;return `<div class="team"><h2>${label(t)}</h2><div class="wallstage"><div class="door ${pass?'visible open':''}"></div><div class="brickfield">${bricks}</div></div></div>`}
function projector(){let phase=state.phase||'play',n=Math.min(state.revealStep||0,events().length),finished=phase==='reveal'&&n===events().length;root.className='projector';if(phase==='reveal'){shell(`<div class="center"><h2>اكتشفوا تأثير اختياراتكم</h2><p class="muted">${n} / ${events().length}</p></div><div class="grid">${wallCard('A',n,finished)}${wallCard('B',n,finished)}</div>`)}else{shell(`<div class="center"><h2>${phase==='results'?'النتائج النهائية':'لوحة النتائج'}</h2><p class="muted">${phase==='results'?'انتهت التحديات — استعدوا للمفاجأة':'التحدي رقم '+(state.round||1)}</p></div><div class="grid">${scoreCard('A')}${scoreCard('B')}</div>`)}}
function admin(){const phase=state.phase||'play';shell(`<div class="panel"><h2>⚙️ لوحة المدير</h2><p>التحكم في العرض على البروجيكتور</p><div class="flex"><button id="play">لوحة النتائج المباشرة</button><button class="secondary" id="results">تثبيت النتائج النهائية</button><button class="gold" id="reveal">🎬 بدء كشف الحيطة</button></div><p>المرحلة الحالية: ${phase} | حدث: ${state.revealStep||0} / ${events().length}</p><div class="flex"><button id="next" class="secondary">الحدث التالي</button><button id="back" class="secondary">الحدث السابق</button><button id="auto" class="green">▶ تشغيل الأنيميشن تلقائيًا</button><button id="stop" class="red">■ إيقاف</button></div><label>رقم التحدي</label><div class="flex"><button class="secondary" id="prevround">−</button><strong>${state.round||1}</strong><button class="secondary" id="nextround">+</button></div><hr style="border-color:#34465b;margin:24px 0"><button class="red" id="reset">🎮 لعبة جديدة (مسح الأسماء والنقط)</button></div><div class="panel"><h2>روابط الأجهزة</h2><label>موبايل فريق A</label><input readonly value="${url('control','A')}"><label>موبايل فريق B</label><input readonly value="${url('control','B')}"><label>اللابتوب</label><input readonly value="${url('projector')}"></div>`);
const phaseTo=p=>update(s=>{s.phase=p;if(p==='reveal')s.revealStep=0});document.querySelector('#play').onclick=()=>phaseTo('play');document.querySelector('#results').onclick=()=>phaseTo('results');document.querySelector('#reveal').onclick=()=>phaseTo('reveal');document.querySelector('#next').onclick=()=>update(s=>{s.phase='reveal';s.revealStep=Math.min(events().length,(s.revealStep||0)+1)});document.querySelector('#back').onclick=()=>update(s=>{s.phase='reveal';s.revealStep=Math.max(0,(s.revealStep||0)-1)});document.querySelector('#nextround').onclick=()=>update(s=>s.round=(s.round||1)+1);document.querySelector('#prevround').onclick=()=>update(s=>s.round=Math.max(1,(s.round||1)-1));document.querySelector('#reset').onclick=()=>{if(confirm('بدء لعبة جديدة؟ سيتم مسح النقاط وأسماء الفريقين')){stop();action({action:'reset'},true)}};document.querySelector('#auto').onclick=()=>{if(animationPlaying)return;animationPlaying=true;const go=async()=>{if(!animationPlaying)return;if((state.revealStep||0)>=events().length){stop();return}await update(s=>{s.phase='reveal';s.revealStep=(s.revealStep||0)+1});timer=setTimeout(go,850)};go()};document.querySelector('#stop').onclick=stop}
function stop(){animationPlaying=false;if(timer)clearTimeout(timer)}function render(){if(role==='control')control();else if(role==='projector')projector();else if(role==='admin')admin();else home()};init();
</script></body></html>
